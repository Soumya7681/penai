name: Publish site

# Builds site/ (landing page + generated docs) and publishes it to GitHub Pages.
# Enable it once under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'assets/**'
      - 'scripts/build-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the documentation
        run: python3 scripts/build-site.py

      - name: Refresh the brand assets the site serves
        run: |
          cp assets/logo-dark.svg site/assets/logo.svg
          cp assets/wordmark-dark.svg site/assets/wordmark.svg
          cp assets/mark-dark.svg site/assets/mark.svg
          cp docs/images/app-dark.png site/assets/app-dark.png
          cp docs/images/app-light.png site/assets/app-light.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
