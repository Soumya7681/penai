<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PenAI</title>
    <meta name="description" content="Offline local AI chat running from a USB drive." />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Content Security Policy: this app is fully offline and must stay that way.
      `connect-src 'self'` means fetch/XHR can only reach the origin that served
      this page (the local llama-server) plus the explicit loopback ports used by
      the optional chat-history sidecar. No remote host is reachable even if a
      dependency tried.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self' http://127.0.0.1:* http://localhost:*;
               form-action 'none';
               base-uri 'none';
               object-src 'none';
               frame-ancestors 'none'"
    />
    <!-- The drive mark from assets/mark.svg, inlined so the tab icon needs no
         second file read from the pendrive. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7c8c'/%3E%3Crect x='6' y='11' width='16' height='11' rx='3.2' fill='none' stroke='%23ffffff' stroke-width='1.8'/%3E%3Cpath d='M22 14h4.2a.8.8 0 0 1 .8.8v2.4a.8.8 0 0 1-.8.8H22z' fill='none' stroke='%23ffffff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Ccircle cx='11.2' cy='16.5' r='2' fill='%237ef0c0'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      PenAI needs JavaScript. It still runs entirely on this computer -- no
      data leaves the machine.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
