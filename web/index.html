<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PendriveAI</title>
    <meta name="description" content="Offline local AI chat running from a USB drive." />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Content Security Policy: this app is fully offline and must stay that way.
      `connect-src 'self'` means fetch/XHR can only reach the origin that served
      this page (the local llama-server) plus the explicit loopback ports used by
      the optional chat-history sidecar. No remote host is reachable even if a
      dependency tried.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self' http://127.0.0.1:* http://localhost:*;
               form-action 'none';
               base-uri 'none';
               object-src 'none';
               frame-ancestors 'none'"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Cpath d='M10 21V11h3.6c2.5 0 4 1.3 4 3.4 0 2.2-1.5 3.5-4 3.5H12v3.1zm2-4.8h1.5c1.3 0 2-.6 2-1.7s-.7-1.7-2-1.7H12z' fill='%2360a5fa'/%3E%3Crect x='19' y='11' width='2.2' height='10' rx='1.1' fill='%2334d399'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      PendriveAI needs JavaScript. It still runs entirely on this computer -- no
      data leaves the machine.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
